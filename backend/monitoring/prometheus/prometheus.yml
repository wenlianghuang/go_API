global:
  scrape_interval: 15s      # 每 15 秒抓取一次 metrics
  evaluation_interval: 15s  # 每 15 秒評估一次 rules
  external_labels:
    cluster: 'iot-api'
    environment: 'development'

# Alertmanager 配置（可選，未來可擴展）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# 規則文件（可選，未來可擴展告警規則）
# rule_files:
#   - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # API 服務的 metrics
  - job_name: 'iot-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:9090']  # Docker 內部服務名稱
        labels:
          service: 'api'
          type: 'application'

