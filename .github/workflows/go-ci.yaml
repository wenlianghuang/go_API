name: Go Continuous Integration

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.20', '1.21', '1.22' ]

    # 設定全域工作目錄，讓所有 run 指令都在 go_API/my-api 下執行
    #defaults:
    #  run:
    #    working-directory: go_API/my-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          # 這裡很重要：告訴 setup-go 依賴檔在哪裡，讓 cache 機制能正確運作
          cache-dependency-path: go_API/my-api/go.sum

      - name: Download Go modules
        run: |
          cd go_API/my-api  # 確保進入包含 go.mod 的資料夾
          go mod tidy
      
      # 【關鍵修正點：後續 run 指令也要 cd 或使用完整路徑】
      - name: Run tests
        run: |
          cd go_API/my-api
          go test -v -race -coverprofile=coverage.txt ./...

      - name: Build application
        run: |
          cd go_API/my-api
          go build -o my-api-binary
          
      # Upload Artifact 步驟仍使用完整路徑 (參見上一個回覆的修正)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app-binary-${{ matrix.go-version }}
          path: go_API/my-api/my-api-binary