name: Go Continuous Integration

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build on Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.20', '1.21', '1.22' ]

    # 設定全域工作目錄，讓所有 run 指令都在 go_API/my-api 下執行
    defaults:
      run:
        working-directory: go_API/my-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          # 這裡很重要：告訴 setup-go 依賴檔在哪裡，讓 cache 機制能正確運作
          cache-dependency-path: go_API/my-api/go.sum

      - name: Download Go modules
        run: go mod tidy

      - name: Run tests
        run: go test -v -race ./...

      - name: Build application
        # 明確指定輸出檔名為 my-api-binary
        run: go build -o my-api-binary

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app-binary-${{ matrix.go-version }}
          # ⚠️ 這裡必須寫完整路徑，因為此步驟不受 defaults 影響
          path: go_API/my-api/my-api-binary