name: Go Continuous Integration

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Go CI
    # 由於我們需要暫時修正 go.mod，這裡先使用一個單一的最新穩定版本，避免矩陣複雜化
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: iot_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 0: 設定一個穩定的 Go 版本 (例如 1.22)
      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          # 使用一個 CI 能夠穩定辨識的最新版本
          go-version: '1.22' 
          cache: true
          cache-dependency-path: backend/go.sum 

      # 【關鍵修正點：Step 1 - 安裝 golang-migrate】
      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          chmod +x /usr/local/bin/migrate
          migrate -version
      
      # Step 2: 暫時修正 go.mod 版本
      - name: Patch go.mod version for CI
        run: |
          cd backend
          echo "Patching go.mod from 1.25.1 to 1.22 for CI run..."
          # 使用 sed 指令將 go 1.25.1 替換為 CI 正在使用的 go 1.22
          # 這樣 go mod tidy 才能正常解析
          sed -i 's/go 1.25.1/go 1.22/g' go.mod
          echo "Patched go.mod content:"
          cat go.mod
          
      # Step 3: 下載 Go Modules 依賴 (使用修正後的 go.mod)
      - name: Download Go modules
        run: |
          cd backend 
          go mod tidy
      
      # Step 4: 執行資料庫遷移
      - name: Run database migrations
        env:
          DATABASE_URL: "postgres://postgres:password@localhost:5432/iot_db_test?sslmode=disable"
        run: |
          cd backend
          migrate -path ./migrations -database "$DATABASE_URL" up
      
      # Step 5: 執行測試與品質檢查
      - name: Run checks and tests
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DB_DSN: "host=localhost user=postgres password=password dbname=iot_db_test port=5432 sslmode=disable TimeZone=UTC"
        run: |
          cd backend
          test -z "$(gofmt -l .)"  # 檢查格式
          go vet ./...              # 執行靜態分析
          go test -v -race -coverprofile=coverage.txt ./... # 執行測試
        
      # Step 6: 建構 Go 應用程式
      - name: Build application
        run: |
          cd backend
          go build -o backend-binary
        
      # Step 7: 上傳建構成品
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app-binary-1.22 # 成品名稱不再使用矩陣
          path: backend/backend-binary
